<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספריית שיחות סגירה — Zero Work</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1e2740;--line:#2a3550;--txt:#e8ecf5;--mut:#8b97b5;--acc:#1E7FE8;--rep:#1E7FE8;--cli:#2bb673;--warn:#e8a31e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Arial,sans-serif;height:100vh;height:100dvh;display:flex;flex-direction:column}
header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
header h1{font-size:18px;margin:0}header span{color:var(--mut);font-size:13px}
main{flex:1;display:flex;min-height:0}
#list{width:340px;border-left:1px solid var(--line);overflow:auto;background:var(--panel)}
.item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:var(--panel2)}.item.on{background:var(--panel2);border-right:4px solid var(--acc)}
.item b{display:block;font-size:15px;margin-bottom:3px}
.item small{color:var(--mut);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-inline-start:6px;background:#2a3550;color:#cdd6ee}
.tag.warn{background:#4a3a10;color:#f3c35a}
#view{flex:1;display:flex;flex-direction:column;min-width:0}
#empty{margin:auto;color:var(--mut)}
#head{padding:14px 22px;border-bottom:1px solid var(--line)}
#head h2{margin:0 0 4px;font-size:21px}#head .meta{color:var(--mut);font-size:13px}
#player{padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:12px;align-items:center}
#player audio{flex:1;height:38px}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px}
#body{flex:1;display:flex;min-height:0}
#tr{position:relative;flex:1.3;overflow:auto;padding:14px 22px;scroll-behavior:smooth}
.seg{display:flex;gap:10px;padding:7px 10px;border-radius:8px;margin:2px 0;cursor:pointer;line-height:1.55;opacity:.55;transition:.15s}
.seg:hover{opacity:.85}
.seg.on{opacity:1;background:var(--panel2);outline:1px solid var(--line)}
.seg .w{flex:0 0 52px;font-size:12px;font-weight:700;padding-top:3px}
.seg.rep .w{color:var(--rep)}.seg.client .w{color:var(--cli)}
.seg .tm{flex:0 0 38px;color:var(--mut);font-size:11px;padding-top:4px;direction:ltr}
#side{flex:1;overflow:auto;border-right:1px solid var(--line);padding:14px 20px;background:var(--panel)}
#side h3{margin:16px 0 6px;font-size:14px;color:#8fc0ff}
#side h3:first-child{margin-top:0}
#side p{margin:0;white-space:pre-wrap;line-height:1.6;font-size:14px;color:#d6ddf0}
.learn{background:#12301f;border:1px solid #1f5a38;border-radius:10px;padding:10px 14px;margin-bottom:6px}
.learn h3{color:#6fe0a0!important;margin-top:0!important}
.note{font-size:12px;color:var(--warn);margin-top:6px}
a{color:#8fc0ff}
.score{display:inline-block;min-width:26px;text-align:center;font-weight:800;font-size:13px;padding:1px 7px;border-radius:9px;background:#1f5a38;color:#6fe0a0;margin-inline-start:8px}
.score.mid{background:#4a3a10;color:#f3c35a}.score.low{background:#2a3550;color:#9fb0d4}
#bar{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--panel);z-index:2}
#bar button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:3px 11px;cursor:pointer;font-size:12px}
#bar button.on{background:var(--acc);border-color:var(--acc)}
.hl{font-size:13px;color:#cfe9da;margin-top:3px;line-height:1.4}
.tl{display:block;width:100%;text-align:right;background:#0f2a1b;border:1px solid #1f5a38;color:var(--txt);border-radius:8px;padding:8px 10px;margin:6px 0;cursor:pointer;font:inherit;font-size:13.5px;line-height:1.5}
.tl:hover{background:#15402a}.tl .t{color:#6fe0a0;font-weight:700;direction:ltr;display:inline-block;margin-inline-end:8px}
.tl q{display:block;color:#a9d9bd;font-size:12.5px;margin-top:2px}.tl small{display:block;color:#b7c4dd;margin-top:3px}
.seg.star{box-shadow:inset -3px 0 0 #6fe0a0}
#back,#tabs{display:none}
@media (max-width:800px){
  header{padding:10px 14px}header h1{font-size:16px}#cnt,#who{display:none}
  main{display:block;position:relative;flex:1;min-height:0}
  #list{width:100%;height:100%;border:0}
  #view{position:absolute;inset:0;display:none;background:var(--bg)}
  body.call #view{display:flex}body.call #list{display:none}
  #back{display:inline-block;background:none;border:1px solid var(--line);color:#8fc0ff;border-radius:6px;padding:4px 10px;margin-bottom:6px;font-size:14px;cursor:pointer}
  #head{padding:10px 14px}#head h2{font-size:18px}
  #player{padding:8px 12px}#player audio{min-width:0;width:100%}
  #tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  #tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:11px;font-size:15px;font-weight:700;cursor:pointer}
  #tabs button.on{color:#fff;border-bottom-color:var(--acc)}
  #body{flex-direction:column}
  #body[data-pane=side] #tr{display:none}#body[data-pane=tr] #side{display:none}
  #tr,#side{flex:1;padding:12px 14px;border:0}
  .seg{padding:8px 6px}.seg .tm{display:none}.seg .w{flex-basis:44px}
  .tl{padding:10px 12px;font-size:14.5px}
  #bar{padding:8px 10px;flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}#bar button{flex:0 0 auto}
}
details{margin-top:14px}summary{cursor:pointer;color:#8fc0ff;font-size:14px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:320px;max-width:90vw;display:flex;flex-direction:column;gap:12px}
#login h2{margin:0 0 4px;font-size:20px}
#login input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:11px;font-size:15px}
#login button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px;font-size:15px;font-weight:700;cursor:pointer}
#login .err{color:#ff8b8b;font-size:13px;min-height:18px}
#out{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:3px 10px;cursor:pointer;margin-inline-start:auto}
</style>
</head>
<body>
<header><h1>🎧 שיחות סגירה — ספריית אימון</h1><span id="cnt"></span><span id="who"></span><button id="out" style="display:none">יציאה</button></header>
<main>
  <div id="list"></div>
  <div id="view"><div id="empty">בחר שיחה מהרשימה</div></div>
</main>
<div id="login"><form id="lf"><h2>🎧 ספריית שיחות סגירה</h2><input id="u" placeholder="שם משתמש" autocomplete="username" autocapitalize="none"><input id="p" type="password" placeholder="סיסמה" autocomplete="current-password"><div class="err" id="err"></div><button>כניסה</button></form></div>
<script>
const API='https://jjbxsivcjhpuobpohpoz.supabase.co/functions/v1/sales-calls';
let TOKEN=localStorage.getItem('sc_token')||'',CALLS=[];
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=t=>{t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const fmtDate=d=>{const [a,b]=d.split(' ');const [y,m,dd]=a.split('-');return dd+'/'+m+'/'+y+' '+b};
const BORDER={'3282542051':'גבולי: סימון הסגירה במאנדיי נעשה ~16 דקות אחרי סוף השיחה (הלקוח קיבל קישור תשלום באמצע השיחה)'};
const LEARN=['ביצועי הנציג','המלצות שיפור לנציג','משפטים שבנו אמון','הזדמנויות שהוחמצו'];
const LEARN_TITLES={'ביצועי הנציג':'💪 מה הנציג עשה טוב','המלצות שיפור לנציג':'🎯 מה לשפר','משפטים שבנו אמון':'🤝 משפטים שבנו אמון','הזדמנויות שהוחמצו':'⚠️ הזדמנויות שהוחמצו'};
let sortMode='score',tagFilter='';
function renderList(){
  $('#cnt').textContent=CALLS.length+' שיחות שנסגרו';
  const L=$('#list');L.innerHTML='';
  const cnt={};CALLS.forEach(c=>((c.ins&&c.ins.tags)||[]).forEach(t=>cnt[t]=(cnt[t]||0)+1));const tags=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0,8);
  const bar=document.createElement('div');bar.id='bar';
  const mk=(txt,on,fn)=>{const b=document.createElement('button');b.textContent=txt;if(on)b.className='on';b.onclick=fn;bar.appendChild(b)};
  mk('הכי שווה להקשיב',sortMode==='score',()=>{sortMode='score';renderList()});
  mk('לפי תאריך',sortMode==='date',()=>{sortMode='date';renderList()});
  mk('הכל',!tagFilter,()=>{tagFilter='';renderList()});
  tags.forEach(t=>mk(t,tagFilter===t,()=>{tagFilter=t;renderList()}));
  L.appendChild(bar);
  let arr=CALLS.filter(c=>!tagFilter||((c.ins&&c.ins.tags)||[]).includes(tagFilter));
  arr.sort((x,y)=>sortMode==='score'?((y.ins?y.ins.score:0)-(x.ins?x.ins.score:0)||y.date.localeCompare(x.date)):y.date.localeCompare(x.date));
  arr.forEach(c=>{
    const d=document.createElement('div');d.className='item';d.dataset.id=c.id;
    const sc=c.ins?`<span class="score ${c.ins.score>=7?'':c.ins.score>=5?'mid':'low'}">${c.ins.score}</span>`:'';
    d.innerHTML=`<b>${esc(c.client)}${sc}${BORDER[c.id]?'<span class="tag warn">גבולי</span>':''}</b><small>${fmtDate(c.date)} · ${Math.round(c.durMin)} דק׳ · ${esc(c.rep)}</small>${c.ins?`<div class="hl">${esc(c.ins.headline)}</div>`:''}`;
    d.onclick=()=>open(c);L.appendChild(d);
  });
  if(cur)document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',e.dataset.id===cur.id));
}
let cur=null,segEls=[],active=-1,follow=true;
function open(c){
  cur=c;active=-1;follow=true;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',e.dataset.id===c.id));
  const ins=c.ins;
  const tlist=(arr,kind)=>(arr||[]).map(x=>`<button class="tl" data-t="${x.t}"><span class="t">${fmt(x.t)}</span>${kind==='q'?esc(x.q):'<b>'+esc(x.title)+'</b>'}${kind==='m'?`<q>״${esc(x.quote)}״</q>`:''}<small>${esc(x.why)}</small></button>`).join('');
  const learn=ins?`<div class="learn"><h3>🎯 למה להקשיב לשיחה הזו</h3><p><b>${esc(ins.headline)}</b></p><p style="margin-top:4px;color:#a9d9bd">${esc(ins.bestFor)}</p>${(ins.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
   ${ins.questions&&ins.questions.length?`<h3>❓ שאלות חזקות ששאל הנציג</h3>${tlist(ins.questions,'q')}`:''}
   ${ins.moments&&ins.moments.length?`<h3>⭐ רגעים חזקים</h3>${tlist(ins.moments,'m')}`:''}`:'';
  const rest=['התנגדויות','צרכים ובעיות','תגובה למחיר','שאלות מרכזיות של הלקוח','משימות המשך','מוצרים שעניינו','ביצועי הנציג','המלצות שיפור לנציג','משפטים שבנו אמון','הזדמנויות שהוחמצו'].map(h=>c.sections[h]?`<h3>${h}</h3><p>${esc(c.sections[h])}</p>`:'').join('');
  $('#view').innerHTML=`
   <div id="head"><button id="back">‹ חזרה לרשימה</button><h2>${esc(c.client)}</h2>
    <div class="meta">${fmtDate(c.date)} · ${Math.round(c.durMin)} דקות · נציג: ${esc(c.rep)}</div>
    ${BORDER[c.id]?`<div class="note">${BORDER[c.id]}</div>`:''}</div>
   <div id="player"><audio id="au" controls src="${API}/audio/${c.id}?token=${encodeURIComponent(TOKEN)}"></audio>
     <select id="sp"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></div>
   <div id="tabs"><button data-p="side" class="on">למה להקשיב</button><button data-p="tr">תמלול</button></div>
   <div id="body" data-pane="side"><div id="tr"></div>
    <div id="side">${learn}<details><summary>עוד מניתוח ה-AI (סיכום, התנגדויות, ביצועי הנציג...)</summary><h3>📝 סיכום</h3><p>${esc(c.summary)}</p>${rest}</details></div></div>`;
  const tr=$('#tr');segEls=c.segments.map((s,i)=>{
    const e=document.createElement('div');e.className='seg '+s.who;
    e.innerHTML=`<span class="tm">${fmt(s.s)}</span><span class="w">${s.who==='rep'?'נציג':'לקוח'}</span><span>${esc(s.t)}</span>`;
    e.onclick=()=>{au.currentTime=s.s;au.play()};tr.appendChild(e);return e});
  const au=$('#au');
  document.body.classList.add('call');
  const setPane=p=>{$('#body').dataset.pane=p;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));if(p==='tr'&&active>=0)setTimeout(()=>{const e=segEls[active];if(e)$('#tr').scrollTop=e.offsetTop-$('#tr').clientHeight/2},30)};
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setPane(b.dataset.p));
  $('#back').onclick=()=>{au.pause();document.body.classList.remove('call')};
  const marks=[...(ins&&ins.questions||[]),...(ins&&ins.moments||[])];
  marks.forEach(m=>{let k=-1;for(let i=0;i<c.segments.length;i++){if(c.segments[i].s<=m.t+1)k=i;else break}if(k>=0)segEls[k].classList.add('star')});
  document.querySelectorAll('.tl').forEach(b=>b.onclick=()=>{setPane('tr');follow=true;au.currentTime=Math.max(0,+b.dataset.t-1);au.play()});
  $('#sp').onchange=e=>au.playbackRate=+e.target.value;
  tr.addEventListener('wheel',()=>{follow=false;clearTimeout(window._ft);window._ft=setTimeout(()=>follow=true,6000)});
  tr.addEventListener('touchmove',()=>{follow=false;clearTimeout(window._ft);window._ft=setTimeout(()=>follow=true,6000)});
  au.addEventListener('timeupdate',()=>tick(au.currentTime));
  au.addEventListener('seeked',()=>{follow=true;tick(au.currentTime)});
}
function tick(t){
  // last segment that has started; keep it highlighted until next starts
  let idx=-1;for(let i=0;i<cur.segments.length;i++){if(cur.segments[i].s<=t+0.15)idx=i;else break}
  if(idx===active)return;
  if(active>=0)segEls[active]&&segEls[active].classList.remove('on');
  active=idx;if(idx<0)return;
  const e=segEls[idx];e.classList.add('on');
  if(follow){const tr=$('#tr');tr.scrollTo({top:e.offsetTop-tr.clientHeight/2+e.clientHeight/2,behavior:'smooth'})}
}
async function load(){
  const r=await fetch(API+'/data',{headers:{Authorization:'Bearer '+TOKEN}});
  if(r.status===401){logout();return false}
  CALLS=await r.json();renderList();$('#login').style.display='none';$('#out').style.display='';
  if(CALLS.length)open([...CALLS].sort((x,y)=>(y.ins?y.ins.score:0)-(x.ins?x.ins.score:0))[0]);return true;
}
function logout(){localStorage.removeItem('sc_token');TOKEN='';location.reload()}
$('#out').onclick=logout;
$('#lf').onsubmit=async e=>{
  e.preventDefault();$('#err').textContent='';
  try{
    const r=await fetch(API+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});
    const j=await r.json();
    if(r.status===429){$('#err').textContent='יותר מדי ניסיונות. נסו שוב בעוד 15 דקות';return}
    if(!r.ok){$('#err').textContent='שם משתמש או סיסמה שגויים';return}
    TOKEN=j.token;localStorage.setItem('sc_token',TOKEN);localStorage.setItem('sc_name',j.name||'');await load();
  }catch(err){$('#err').textContent='שגיאת חיבור'}
};
if(TOKEN)load();
</script>
</body>
</html>
